<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>NGSC</title>
  <script>
    // GitHub Pages SPA redirect: preserve the path and query string
    // so deep links to /card/[slug] and /leaders/[slug] work after reload.
    var seg = 1;
    var l = window.location;
    var path = l.pathname.slice(1).split('/').slice(seg).join('/');
    if (path) {
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        '/' + l.pathname.split('/')[1] +
        '/?p=/' + path.replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    }
  </script>
</head>
<body></body>
</html>
